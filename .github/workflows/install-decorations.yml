name: Install storybook decorations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-decorations.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add decoration script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="decorations.js" defer></script>'
          if tag not in s:
              s = s.replace('</body>', f'{tag}\n\n</body>')
              p.write_text(s)
          PY
      - name: Commit decoration hook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable storybook dragon decorations"
            git push
          fi